<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoMap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen py-10 px-4 font-sans antialiased transition-colors duration-200">

  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Переключатель темы -->
    <div class="flex justify-end">
      <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:text-blue-500 shadow-sm transition-all" title="Сменить тему">
        <svg id="moon-icon" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </button>
    </div>

    <!-- Заголовок -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold tracking-tight sm:text-4xl text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-emerald-600 dark:from-blue-400 dark:to-emerald-400">
        AlgoMap
      </h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm sm:text-base">
        Твой личный роадмап по алгоритмам.
      </p>
    </header>

    <!-- Прогресс -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm dark:shadow-lg space-y-3">
      <div class="flex justify-between items-center text-sm font-medium">
        <span class="text-slate-600 dark:text-slate-300">Общий прогресс:</span>
        <span id="progress-text" class="text-emerald-600 dark:text-emerald-400 font-bold">0 / 0 (0%)</span>
      </div>
      <div class="w-full bg-slate-100 dark:bg-slate-800 h-3 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-emerald-400 h-full w-0 transition-all duration-300 ease-out"></div>
      </div>
      <div class="flex justify-end pt-1">
        <button onclick="resetProgress()" class="text-xs text-rose-500 dark:text-rose-400 hover:underline">
          Сбросить мой прогресс
        </button>
      </div>
    </div>

    <!-- Фильтры -->
    <div class="flex flex-wrap gap-3 items-center justify-between bg-slate-200/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 p-3 rounded-xl">
      <!-- Статус -->
      <div class="flex gap-1 bg-white dark:bg-slate-950 p-1 rounded-lg border border-slate-200 dark:border-slate-800 text-xs sm:text-sm">
        <button onclick="setStatusFilter('all')" id="filter-all" class="px-3 py-1.5 rounded-md font-medium bg-slate-900 dark:bg-slate-800 text-white">Все</button>
        <button onclick="setStatusFilter('unsolved')" id="filter-unsolved" class="px-3 py-1.5 rounded-md font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Не решено</button>
        <button onclick="setStatusFilter('solved')" id="filter-solved" class="px-3 py-1.5 rounded-md font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Решено</button>
      </div>

      <!-- Выпадающие списки (Сложность и Категории) -->
      <div class="flex gap-2 flex-wrap sm:flex-nowrap">
        <select id="category-filter" onchange="setCategoryFilter(this.value)" class="bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 text-xs sm:text-sm rounded-lg px-3 py-2 outline-none">
          <option value="all">Все разделы</option>
        </select>

        <select id="difficulty-filter" onchange="setDiffFilter(this.value)" class="bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 text-xs sm:text-sm rounded-lg px-3 py-2 outline-none">
          <option value="all">Любая сложность</option>
          <option value="Easy">Только Easy</option>
          <option value="Medium">Только Medium</option>
          <option value="Hard">Только Hard</option>
        </select>
      </div>
    </div>

    <!-- Контейнер для задач по категориям -->
    <div id="task-list" class="space-y-6">
      <div class="text-center py-10 text-slate-400">Загрузка задач...</div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
